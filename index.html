<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Projeto Sobrevivência 3D — Protótipo</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b8df;font-family:system-ui,-apple-system,Arial,sans-serif;touch-action:none}
  #game{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
  .panel{background:#101820b8;border:1px solid #ffffff55;border-radius:10px;padding:8px 11px;backdrop-filter:blur(4px)}
  #brand{position:absolute;top:12px;left:12px;font-weight:900;letter-spacing:1px;font-size:13px}
  #status{position:absolute;top:12px;right:12px;font-size:12px;text-align:right}
  #help{position:absolute;top:60px;left:12px;max-width:240px;font-size:12px;line-height:1.4}
  #crosshair{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:25px;font-weight:300}
  #bottom{position:absolute;left:12px;bottom:15px;width:180px}
  #healthLabel{font-size:12px;margin-bottom:5px}
  #healthOuter{height:9px;background:#0009;border:1px solid #ffffff88;border-radius:8px;overflow:hidden}
  #health{height:100%;width:100%;background:#70e080}
  #joystick{position:absolute;left:22px;bottom:26px;width:118px;height:118px;border-radius:50%;background:#09131b55;border:2px solid #ffffff66;pointer-events:auto;touch-action:none}
  #stick{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#eaf3ffb8;border:2px solid white;box-shadow:0 2px 8px #0008}
  .action{position:absolute;pointer-events:auto;touch-action:none;border:2px solid #ffffffaa;border-radius:50%;background:#10182099;color:white;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0006}
  #fire{right:24px;bottom:42px;width:78px;height:78px;background:#b83b2fbb;font-size:13px}
  #jump{right:112px;bottom:114px;width:54px;height:54px;font-size:11px}
  #crouch{right:115px;bottom:49px;width:50px;height:50px;font-size:10px}
  #lookHint{position:absolute;right:14px;top:48%;font-size:10px;opacity:.8;text-align:right}
  #toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:14px;font-weight:800;white-space:nowrap}
  @media(min-width:800px){#joystick{width:132px;height:132px}#stick{left:40px;top:40px}#help{max-width:300px;font-size:13px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="brand" class="panel">PROJETO SOBREVIVÊNCIA <span style="color:#a9e77b">3D</span></div>
  <div id="status" class="panel">PROTÓTIPO 01<br><span id="targetsText">Alvos: 5</span></div>
  <div id="help" class="panel">Explore o cenário. Use o controle para andar e arraste o lado direito da tela para girar a câmera. Acerte os alvos vermelhos para testar os disparos.</div>
  <div id="crosshair">+</div>
  <div id="lookHint">ARRASTE PARA<br>GIRAR A CÂMERA</div>
  <div id="bottom"><div id="healthLabel">VIDA <span id="healthNum">100</span>%</div><div id="healthOuter"><div id="health"></div></div></div>
  <div id="toast"></div>
  <div id="joystick"><div id="stick"></div></div>
  <button id="fire" class="action">DISPARAR</button>
  <button id="jump" class="action">PULAR</button>
  <button id="crouch" class="action">AGACHAR</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b9e5);
scene.fog=new THREE.Fog(0x87b9e5,65,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x596044,2.0));
const sun=new THREE.DirectionalLight(0xfff1d5,3.0);
sun.position.set(-35,55,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
scene.add(sun);

const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x777b50);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260,1,1),groundMat);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

function box(w,h,d,color,x,y,z,collide=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
 if(collide) obstacles.push({x,z,rx:w/2,rz:d/2});
 return m;
}
const obstacles=[];
/* compound buildings */
box(17,5,12,0x777a79,12,0,-18);
box(17.4,1.1,12.4,0x9c4938,12,5,-18,false);
box(9,4,8,0x6d777a,31,0,-13);
box(10,6,9,0xb5a78b,-25,0,-27);
box(8,1,9,0x51483b,-25,6,-27,false);
/* doors and windows */
box(.2,2,2,0x302b25,12,0,-11.85,false);
for(const [x,z] of [[7,-11.85],[17,-11.85],[8,-24.15],[16,-24.15]]){
 box(1.5,1.3,.12,0x293f49,x,2.5,z,false);
}
/* crates */
for(const [x,z] of [[2,-8],[5,-8],[22,-7],[24,-9],[3,-24],[20,-24],[-7,-15],[-11,-19],[34,-25]]){
 box(1.7,1.6,1.7,0x79583b,x,0,z);
 box(1.72,.12,1.72,0x4a392b,x,1.6,z,false);
}
/* coastal water and cliff */
const sea=new THREE.Mesh(new THREE.PlaneGeometry(260,65),new THREE.MeshStandardMaterial({color:0x176f9d,roughness:.35,metalness:.1}));
sea.rotation.x=-Math.PI/2;sea.position.set(0,-.15,-82);scene.add(sea);
box(260,4,9,0x8e876b,0,-1,-47,false);
/* tower */
const towerMat=mat(0x464d50);
function beam(a,b,r=.12){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),dir=new THREE.Vector3().subVectors(B,A);
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r*.72,r,dir.length(),5),towerMat);
 mesh.position.copy(A).add(B).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());mesh.castShadow=true;scene.add(mesh);
}
for(let y=1;y<22;y+=5){
 beam([-20,y,-38],[-14,y+5,-38]);beam([-14,y+5,-38],[-8,y,-38]);
 beam([-20,y,-38],[-8,y,-38],.09);
}
beam([-14,0,-38],[-14,23,-38],.16);
beam([-24,13,-38],[-4,13,-38],.13);
beam([-22,18,-38],[-6,18,-38],.13);
for(let y=2;y<20;y+=4)beam([-20,y,-38],[-8,y+4,-38],.07);

/* simple trees */
for(const [x,z,s] of [[-40,-10,1.4],[-35,-35,1.1],[-4,-38,1.2],[39,-32,1.4],[43,-2,1.1],[-42,12,1.3],[36,17,1.2],[-33,25,1.4],[0,18,1.1]]){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.35*s,2.4*s,7),mat(0x57402b));trunk.position.set(x,1.2*s,z);trunk.castShadow=true;scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.2*s,8,7),mat(0x3f6c3d));crown.position.set(x,3.1*s,z);crown.castShadow=true;scene.add(crown);
}
/* grass tufts */
const grassMat=mat(0x8c965b);
for(let i=0;i<180;i++){
 const x=(Math.random()-.5)*115,z=(Math.random()-.5)*100;
 if(z<-42||Math.abs(x)<7&&z<0)continue;
 const g=new THREE.Mesh(new THREE.ConeGeometry(.22+Math.random()*.18,.5+Math.random()*.8,4),grassMat);
 g.position.set(x,.25,z);g.rotation.z=(Math.random()-.5)*.3;scene.add(g);
}

/* player character, intentionally modular so we can replace it with a detailed model later */
const player=new THREE.Group();scene.add(player);
const skin=mat(0xb7835d), shirt=mat(0x303d39), pants=mat(0x292d2a), gear=mat(0x5a5542), helmet=mat(0x202b2d);
function part(geo,material,x,y,z){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;player.add(m);return m;}
part(new THREE.CapsuleGeometry(.42,.75,4,8),shirt,0,1.45,0);
part(new THREE.BoxGeometry(.72,.75,.32),gear,0,1.55,.16);
part(new THREE.SphereGeometry(.31,12,10),skin,0,2.15,0);
part(new THREE.SphereGeometry(.34,12,8),helmet,0,2.35,0);
part(new THREE.BoxGeometry(.54,.1,.12),helmet,0,2.27,.28);
part(new THREE.BoxGeometry(.62,.48,.42),gear,0,1.7,-.4);
const legs=[];
for(const side of [-1,1]){
 const leg=part(new THREE.CapsuleGeometry(.16,.62,3,6),pants,side*.22,.62,0);legs.push(leg);
 part(new THREE.BoxGeometry(.25,.16,.42),mat(0x151a19),side*.22,.18,.1);
 const arm=part(new THREE.CapsuleGeometry(.13,.48,3,6),shirt,side*.48,1.55,.06);arm.rotation.z=side*.3;
}
const gun=part(new THREE.BoxGeometry(.16,.15,.9),mat(0x171c1d),.28,1.4,.65);gun.rotation.x=-.1;
player.position.set(0,0,9);

/* targets */
const targets=[];
function makeTarget(x,z){
 const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);
 const red=mat(0xb93d30), dark=mat(0x353a39);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,4,8),red);body.position.y=1.05;body.castShadow=true;group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),dark);head.position.y=1.85;group.add(head);
 targets.push({group,alive:true});
}
[[-1,-18],[18,-31],[34,1],[-24,4],[4,-39]].forEach(p=>makeTarget(...p));
document.querySelector('#targetsText').textContent='Alvos: '+targets.length;

let yaw=0, pitch=.16, moveX=0, moveY=0, moving=false, jumping=0, crouched=false, health=100;
const joystick=document.querySelector('#joystick'),stick=document.querySelector('#stick');
let joyPointer=null;
function setJoy(e){
 const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;const max=38,dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 moveX=dx/max;moveY=dy/max;
}
joystick.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);setJoy(e);});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e);});
function releaseJoy(){joyPointer=null;moveX=0;moveY=0;stick.style.transform='translate(0,0)';}
joystick.addEventListener('pointerup',releaseJoy);joystick.addEventListener('pointercancel',releaseJoy);

/* drag on the right half rotates the camera */
let lookPointer=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.42){lookPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);}
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(e.pointerId===lookPointer){
  yaw-=(e.clientX-lastX)*.006;pitch=Math.max(-.1,Math.min(.65,pitch+(e.clientY-lastY)*.003));
  lastX=e.clientX;lastY=e.clientY;
 }
});
renderer.domElement.addEventListener('pointerup',()=>lookPointer=null);
renderer.domElement.addEventListener('pointercancel',()=>lookPointer=null);

/* desktop keyboard */
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')jumping=.18;if(e.key.toLowerCase()==='c')crouched=!crouched;if(e.key.toLowerCase()==='f')shoot();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jumping=.18;});
document.querySelector('#crouch').addEventListener('pointerdown',e=>{e.preventDefault();crouched=!crouched;document.querySelector('#crouch').style.background=crouched?'#64864dcc':'#10182099';});
const toast=document.querySelector('#toast');let toastTimer=0;
function message(s){toast.textContent=s;toastTimer=2.0;}
function shoot(){
 const origin=player.position.clone();origin.y+=1.5;
 const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
 let best=null,bestDist=36;
 for(const t of targets){if(!t.alive)continue;
  const p=t.group.position.clone().add(new THREE.Vector3(0,1.1,0)).sub(origin);
  const along=p.dot(forward);if(along<0||along>bestDist)continue;
  const side=p.clone().addScaledVector(forward,-along).length();
  if(side<1.8){best=t;bestDist=along;}
 }
 const start=origin.clone().add(new THREE.Vector3(.25,.0,.35).applyAxisAngle(new THREE.Vector3(0,1,0),yaw));
 const end=best?best.group.position.clone().add(new THREE.Vector3(0,1.2,0)):origin.clone().addScaledVector(forward,28);
 const points=[start,end],geo=new THREE.BufferGeometry().setFromPoints(points);
 const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffd27a,transparent:true,opacity:.95}));scene.add(line);
 setTimeout(()=>{scene.remove(line);geo.dispose();line.material.dispose();},100);
 if(best){best.alive=false;scene.remove(best.group);message('ALVO ATINGIDO!');}
 else message('DISPARO!');
 document.querySelector('#targetsText').textContent='Alvos: '+targets.filter(t=>t.alive).length;
}
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot();});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let ky=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const ix=Math.abs(moveX)>.04?moveX:kx, iy=Math.abs(moveY)>.04?-moveY:ky;
 const len=Math.hypot(ix,iy);
 if(len>.05){
  const speed=6.0*(crouched?.48:1);
  const forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
  const delta=forward.multiplyScalar(iy/len*speed*dt).add(right.multiplyScalar(ix/len*speed*dt));
  const nx=player.position.x+delta.x,nz=player.position.z+delta.z;
  const blocked=obstacles.some(o=>Math.abs(nx-o.x)<o.rx+.65&&Math.abs(nz-o.z)<o.rz+.65);
  if(!blocked){player.position.x=THREE.MathUtils.clamp(nx,-62,62);player.position.z=THREE.MathUtils.clamp(nz,-54,42);}
  player.rotation.y=yaw;
  legs.forEach((l,i)=>{l.rotation.x=Math.sin(performance.now()*.012+i*Math.PI)*.45;});
 }else legs.forEach(l=>l.rotation.x=THREE.MathUtils.damp(l.rotation.x,0,7,dt));
 if(jumping>0){player.position.y=Math.max(0,Math.sin((.18-jumping)/.18*Math.PI)*1.25);jumping-=dt;}else player.position.y=0;
 const headHeight=crouched?1.8:2.15;
 const desired=new THREE.Vector3(
  player.position.x-Math.sin(yaw)*8,
  player.position.y+3.3+pitch*4,
  player.position.z+Math.cos(yaw)*8
 );
 camera.position.lerp(desired,1-Math.exp(-5*dt));
 const look=new THREE.Vector3(player.position.x,player.position.y+headHeight,player.position.z);
 look.x+=Math.sin(yaw)*2;look.z-=Math.cos(yaw)*2;look.y+=pitch*2;
 camera.lookAt(look);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.textContent='';}
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
